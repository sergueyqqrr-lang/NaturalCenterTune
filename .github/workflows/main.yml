name: Build NaturalCenter Tune

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  dsp-test:
    name: DSP tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the stand-alone DSP test
        run: |
          g++ -std=c++17 -O2 tests/dsp_test.cpp -o dsp_test
          ./dsp_test

  build:
    name: ${{ matrix.name }}
    needs: dsp-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (VST3 + Standalone)
            os: windows-latest
            artifact: NaturalCenterTune-Windows
          - name: macOS (VST3 + AU + Standalone, universal)
            os: macos-latest
            artifact: NaturalCenterTune-macOS
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux (VST3 + Standalone)
            os: ubuntu-latest
            artifact: NaturalCenterTune-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload plugin binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/NaturalCenterTune_artefacts/Release/VST3
            build/NaturalCenterTune_artefacts/Release/AU
            build/NaturalCenterTune_artefacts/Release/Standalone
          if-no-files-found: error
